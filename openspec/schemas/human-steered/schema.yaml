name: human-steered
version: 1
description: Compact 5W + How, observable specs and verified tasks; portable human review after implementation.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Living 5W + How brief and capability inventory
    template: proposal.md
    instruction: |
      Investigate before drafting. Capture the 5W's and a compact How in this single brief.
      During exploration leave How unchosen; refine here rather than creating a design document.
      Explain the consequential tradeoff and simplest alternative; ask only material questions.
      Use capability names matching existing specs; list new/modified capabilities for the specs artifact.
      Unknown feasibility in a spike is an investigation output, not a question the human must answer upfront.
      Specs hold observable criteria; link them instead of duplicating requirements.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Observable acceptance criteria using standard OpenSpec delta syntax
    template: spec.md
    instruction: |
      Read proposal.md and existing capability specs. Write one delta per declared capability.
      Use standard OpenSpec ADDED/MODIFIED/REMOVED/RENAMED Requirements syntax.
      Requirement titles include stable AC IDs; every requirement has a #### Scenario with WHEN and THEN.
      For a new capability include a Purpose of at least 50 characters; omit Purpose for existing ones.
      For MODIFIED copy the entire existing requirement and all scenarios before editing.
      State observable user/downstream behavior, boundaries and check ownership, not internal implementation.
      Spikes specify investigation deliverables and conditional findings; do not promise an implemented feature.
      Do not invent requirements for pure tooling/docs changes; explicitly use skip_specs metadata if applicable.
    requires: [proposal]
  - id: tasks
    generates: tasks.md
    description: Small implementation slices with verification and evidence setup
    template: tasks.md
    instruction: |
      Derive tasks from proposal.md's How and the spec criteria. No separate design.md exists.
      Each tracked task is a - [ ] checkbox with its own observable completion check.
      Include URL/role/safe fixtures/runner setup and likely regression controls before implementation.
      Complete tests and relevant documentation with each slice, not as a final deferred phase.
      Execution writes evidence.md with AC IDs, expected/actual, status, provenance and a safe recipe.
      Human review/testing and eventual archive belong in plain workflow-follow-up bullets, not agent-completed checkboxes.
    requires: [proposal, specs]
apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Implement the agreed slices and execute their checks; diagnose failures, fix and recheck affected controls.
    Read proposal.md and specs, record real results in evidence.md; do not invent a design.md dependency.
    Pause only for material scope/risk decisions, unavailable prerequisites or lack of progress.
    Use OpenSpec verify for alignment, not as proof that tests ran. Then prepare the guided test and human review.
